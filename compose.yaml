services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: neria
      POSTGRES_USER: neria_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neria_dev -d neria"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  neria_pgdata: